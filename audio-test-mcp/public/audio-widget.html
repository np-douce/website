<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="font-family:system-ui;padding:12px"><h3>Audio Test v0.2</h3><p>Server-generated WAV, no browser speech synthesis.</p><audio id="player" controls style="width:100%"></audio><p id="status">Waiting for audio...</p><script>
const player=document.getElementById('player');
const status=document.getElementById('status');
window.addEventListener('message',function(event){
 const msg=event.data;
 if(msg && msg.method==='ui/notifications/tool-result'){
  const data=msg.params && msg.params.structuredContent;
  if(data && typeof data.audioDataUrl==='string'){
   player.src=data.audioDataUrl;
   status.textContent='Audio ready. Tap Play.';
  }
 }
});
player.addEventListener('error',function(){status.textContent='Audio playback failed';});
</script></body></html>
